name: Upload to YouTube

on:
  push:
    branches: [main]
    paths: ["videos/*.mp4"]
  workflow_dispatch:
    inputs:
      name:
        description: "Episode name to upload (e.g. 2026-11-19). Empty = all pending."
        required: false

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # Episodes before this date were already published via Metricool; never re-upload them.
      START_DATE: "2026-11-19"
    steps:
      - uses: actions/checkout@v4
      - name: Upload pending episodes
        run: |
          set -e
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "YouTube secrets not set"; exit 1; fi
          names="${{ github.event.inputs.name }}"
          if [ -z "$names" ]; then
            for f in videos/*.mp4; do
              n=$(basename "$f" .mp4)
              [ -f "episodes/$n.json" ] || continue
              [ -f "episodes/$n.youtube.json" ] && continue
              [[ "$n" < "$START_DATE" ]] && continue
              names="$names $n"
            done
          fi
          echo "To upload: $names"
          for n in $names; do python3 scripts/upload_youtube.py "$n"; done
      - name: Commit upload records
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add episodes/*.youtube.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Record YouTube upload" && git pull --rebase origin main && git push)
